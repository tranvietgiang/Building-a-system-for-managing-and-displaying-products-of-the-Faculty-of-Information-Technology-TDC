name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-laravel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend-laravel/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend-laravel/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p tests/Feature tests/Unit
          touch database/database.sqlite

      - name: Run tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: vendor/bin/phpunit

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-reactjs

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-reactjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-reactjs/dist

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Add hosting to known hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy frontend
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USERNAME"
          test -n "$SSHPASS"
          test -n "$FRONTEND_PATH"
          rsync -az --delete --exclude=".htaccess" -e "sshpass -e ssh -p ${SSH_PORT:-22}" frontend-dist/ "$SSH_USERNAME@$SSH_HOST:$FRONTEND_PATH/"

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Add hosting to known hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Create production Laravel env
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > backend-laravel/.env.production <<EOF
          APP_NAME="TDC Gallery"
          APP_ENV=production
          APP_KEY="$APP_KEY"
          APP_DEBUG=false
          APP_URL="${APP_URL:-https://api.tvg.adtech.pro.vn/api}"

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST="$DB_HOST"
          DB_PORT="${DB_PORT:-3306}"
          DB_DATABASE="$DB_DATABASE"
          DB_USERNAME="$DB_USERNAME"
          DB_PASSWORD="$DB_PASSWORD"

          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=.tvg.adtech.pro.vn
          SESSION_SECURE_COOKIE=true
          SESSION_HTTP_ONLY=true
          SESSION_SAME_SITE=lax
          SANCTUM_STATEFUL_DOMAINS=tvg.adtech.pro.vn

          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=public
          QUEUE_CONNECTION=database
          CACHE_STORE=database

          MAIL_MAILER=smtp
          MAIL_HOST=localhost
          MAIL_PORT=587
          MAIL_USERNAME="$MAIL_USERNAME"
          MAIL_PASSWORD="$MAIL_PASSWORD"
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=noreply@tvg.adtech.pro.vn
          MAIL_FROM_NAME="TDC Gallery"

          CLOUDINARY_URL="$CLOUDINARY_URL"
          OPENAI_API_KEY="$OPENAI_API_KEY"
          EOF

      - name: Deploy backend source
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          BACKEND_PATH: ${{ secrets.BACKEND_PATH }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USERNAME"
          test -n "$SSHPASS"
          test -n "$BACKEND_PATH"
          rsync -az --delete \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="vendor/" \
            --exclude="node_modules/" \
            --exclude="storage/" \
            --exclude="bootstrap/cache/*.php" \
            -e "sshpass -e ssh -p ${SSH_PORT:-22}" \
            backend-laravel/ "$SSH_USERNAME@$SSH_HOST:$BACKEND_PATH/"
          rsync -az -e "sshpass -e ssh -p ${SSH_PORT:-22}" backend-laravel/.env.production "$SSH_USERNAME@$SSH_HOST:$BACKEND_PATH/.env"

      - name: Finalize backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd "${{ secrets.BACKEND_PATH }}"
            mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan view:cache
